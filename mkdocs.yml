site_name: DevOps Horizon
site_url: https://devops-horizon.example.com
site_author: Alexandre Martin
site_description: Blog DevOps, Kubernetes, Terraform, Cloud & Platform Engineering par un consultant senior.
repo_name: devops-horizon
repo_url: https://github.com/aissbilel/mkdocs

copyright: © 2026 Alexandre Martin — Tous droits réservés

theme:
  name: material
  language: fr
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - header.autohide
    - announce.dismiss
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mode clair
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/kubernetes
    repo: fontawesome/brands/github
  favicon: assets/favicon.png

plugins:
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
  - tags
  - search
  - social
  - glightbox
  - minify
  - git-revision-date-localized:
      enable_creation_date: true
  - rss

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/votreprofil
    - icon: fontawesome/brands/github
      link: https://github.com/aissbilel
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/votrehandle

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js